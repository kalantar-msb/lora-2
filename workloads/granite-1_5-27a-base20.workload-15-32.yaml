# BLIS workload spec -- this bundle's granite deployment, 27 adapters.
#
# The 9 LoRA adapters of ibm-granite/rag-intrinsics-lib for
# ibm-granite/granite-3.3-2b-instruct, each installed 3 times. Needs
# ADAPTER_COPIES=3 in baselines/defaults/lora-serving.yaml, which installs every
# adapter under its own name plus <adapter>-2 and <adapter>-3. vLLM treats each name
# as a separate adapter (own GPU slot, own CPU-cache entry) although the weights match.
#
# Everything except the adapter set is copied from granite-9adapter.workload.yaml:
# seed 42, aggregate_rate 6.0 req/s, num_requests 1500, Poisson
# arrivals, gaussian(256,64) input, exponential(32) output. Each client's settings
# are those of the original adapter it copies.
#
# rate_fraction is Zipf(alpha=1.5) over N=27: rank i gets i^-1.5, normalized to
# sum to 1. Ranks are interleaved so every adapter keeps one copy at each popularity
# level: ranks 1-9 are the 9 originals in the 9-adapter file's popularity order, ranks
# 10-18 their -2 copies, ranks 19-27 their -3 copies. Recompute, do not hand-edit,
# if N or alpha changes.
#
# BASE-MODEL TRAFFIC. A 28th client, client-base, sends requests with no `adapter`, so they
# go to the base model (BLIS: an empty adapter means base-model-only). It has the same input
# and output distributions as the adapter clients and takes rate_fraction 0.2. The 27 adapter
# fractions are the Zipf values above scaled by 0.8, so the adapter traffic is unchanged
# from granite-1_5-27adapter.workload-15-32.yaml: aggregate_rate is that file's rate / 0.8 and num_requests is scaled
# by the same factor, so the cell runs as long. The rate in this file's name is the
# adapter rate, not the total.
#
# Consumed by `blis observe --workload-spec --dispatch-adapters` (and `blis run`).
version: '2'
seed: 42
aggregate_rate: 18.75
num_requests: 11250
clients:
- id: client-answerability
  model: ibm-granite/granite-3.3-2b-instruct
  rate_fraction: 0.3585826196059816
  streaming: false
  arrival:
    process: poisson
  input_distribution:
    type: gaussian
    params:
      mean: 256
      std_dev: 64
      min: 16
      max: 2048
  output_distribution:
    type: exponential
    params:
      mean: 32
  adapter: answerability
